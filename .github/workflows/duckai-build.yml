name: Build DuckAI Android APK 🦆

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Build with Buildozer Action
      uses: ArtemShat/buildozer-action@v1.2.0
      with:
        workdir: .
        buildozer_version: stable

    - name: Upload DuckAI APK
      uses: actions/upload-artifact@v4
      with:
        name: DuckAI-APK
        path: bin/*.apk
        

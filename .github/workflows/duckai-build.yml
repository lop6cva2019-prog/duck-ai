name: Build DuckAI Android APK 🦆

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Init buildozer.spec if missing
      run: |
        if [ ! -f buildozer.spec ]; then
          pip install buildozer
          buildozer init
          sed -i 's/title = My Application/title = Duck AI/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = duckai/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests,urllib3,chardet,idna,certifi/g' buildozer.spec
          sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET/g' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        fi

    - name: Build APK with Buildozer Action
      uses: ArtemSydoryk/buildozer-action@v1
      with:
        workdir: .

    - name: Upload DuckAI APK
      uses: actions/upload-artifact@v4
      with:
        name: DuckAI-APK
        path: bin/*.apk
        

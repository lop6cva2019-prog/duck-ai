name: Build DuckAI Android APK 🦆

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev readline-common libreadline-dev libffi-dev uuid-dev libncurses5-dev libncursesw5-dev xz-utils zip unzip openjdk-17-jdk ccache p7zip-full

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools
        pip install "cython<3.0.0" "buildozer==1.5.0"

    - name: Init Buildozer Spec if not exist
      run: |
        if [ ! -f buildozer.spec ]; then
          buildozer init
          sed -i 's/title = My Application/title = Duck AI/g' buildozer.spec
          sed -i 's/package.name = myapp/package.name = duckai/g' buildozer.spec
          sed -i 's/requirements = python3,kivy/requirements = python3,kivy,requests,urllib3,chardet,idna,certifi/g' buildozer.spec
          sed -i 's/#android.permissions = INTERNET/android.permissions = INTERNET/g' buildozer.spec
          sed -i 's/#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        fi

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload DuckAI APK
      uses: actions/upload-artifact@v4
      with:
        name: DuckAI-APK
        path: bin/*.apk
        

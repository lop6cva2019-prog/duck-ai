name: Build DuckAI Android APK 🦆

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev ncurses-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev libffi-dev libssl-dev libtinfo5 lld

    - name: Install Python Tools
      run: |
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer kivy requests certifi

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload DuckAI APK
      uses: actions/upload-artifact@v4
      with:
        name: DuckAI-APK
        path: bin/*.apk
        
